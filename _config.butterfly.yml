# Hexo Butterfly 主题配置 - Google商店极简风格

# 导航栏
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: true

# 站点图标
favicon: /img/favicon.ico

# 首页欢迎图
default_top_img: /img/ruri_white.webp
index_img: /img/ruri_white.webp

# 菜单
menu:
  主页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags

# 代码块
code_blocks:
  theme: light
  macStyle: false
  copy: true
  language: true
  shrink: false

# 头像与个人信息
avatar:
  img: /img/avatar.jpg
  effect: false

# 社交链接
social: {}

# 个人资料卡
aside:
  enable: true
  position: left
  card_author:
    enable: true
    description: '记录生活与技术，保持轻量与持续输出。'
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/GokouRuri-suki
  card_announcement:
    enable: true
    content: '记录生活、技术与轻量思考。'
  card_recent_post:
    enable: true
    limit: 5
  card_tags:
    enable: true
    limit: 40
  card_archives:
    enable: true
    type: monthly
    limit: 8

# 页脚
footer:
  owner:
    enable: false
    since: 2026
  custom_text: '&copy;&nbsp;2026 - 2027 By GokouRuri-suki'
  copyright: false

# 主题颜色 - 极简中性灰
theme_color:
  enable: true
  main: '#1f2430'
  paginator: '#1f2430'
  button_hover: '#2f3746'
  text_selection: '#1f2430'
  link_color: '#1f2430'
  link_hover_color: '#4b5563'

# 夜间模式
darkmode:
  enable: true
  button: true

# 文章元数据
post_meta:
  date_type: created
  categories: true
  tags: false
  update_format: relative

# 首页设置
index_post_content:
  method: 1
  length: 150

# 字体 - Google字体
font:
  global_font_size: 18px
  code_font_size: 16px
  font_family: 'Roboto, "Helvetica Neue", Arial, sans-serif'

# 极简功能
fancybox: false
lazyload: false
pjax: false

# 搜索配置（如需启用请设置 use: local_search 并安装 hexo-generator-searchdb）
search:
  use:

# 分享功能 - 关闭
share:
  use:

# 评论系统 - Utterances（GitHub Issues 留言，网站保持静态）
comments:
  use: Utterances
  text: true
  lazyload: false
  count: false

utterances:
  repo: GokouRuri-suki/Ruri_blog
  issue_term: pathname
  light_theme: github-light
  dark_theme: photon-dark
  option:
    label: '💬 评论'

# 数学公式 - 关闭
math:
  use:

# 打赏功能 - 简化
reward:
  enable: false

# 404 页面
error_404:
  enable: true
  subtitle: '页面走丢了'
  background: /img/error-page.png

# 自定义注入 - 只保留正式样式文件
inject:
  head:
    - <link rel="preconnect" href="https://fonts.googleapis.com">
    - <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    - <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    - <link rel="stylesheet" href="/Ruri_blog/css/google-style.css">
  
  bottom: []